<div class="count">
  <p class="main">{{ count() }}</p>
  <p class="sub">doubled: {{ doubled() }}</p>
  <div class="actions">
    <button (click)="substract()">-</button>
    <button (click)="reset()">reset</button>
    <button (click)="increment()">+</button>
  </div>
  @if (count() < 0) {
    <p class="error">Count is negative!</p>
  }
</div>
